name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/scam_kb.py"
      - "scripts/export_rules.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export scam rules into the app
        run: python -m scripts.export_rules

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KavachGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KavachGuard-apk
          path: KavachGuard.apk

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest KavachGuard.apk \
            --title "Kavach Guard (latest build #${{ github.run_number }})" \
            --notes "Install on Android: download KavachGuard.apk, open it, allow 'Install unknown apps'. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}"
